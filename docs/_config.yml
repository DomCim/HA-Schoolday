title: Schoolday
description: The school week and the daily routines, on the wall.
# `theme`, not `remote_theme`: the site is built by our own workflow with a Gemfile,
# so the gem is simply installed rather than fetched at build time.
theme: just-the-docs

# Named explicitly. GitHub Pages switches jekyll-relative-links on for you; a
# self-built site does not, and without it every `[page](page.md)` link here 404s.
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: false
url: https://domcim.github.io
baseurl: /HA-Schoolday

# The repository link in the theme's footer, and the "edit this page" target.
aux_links:
  Schoolday on GitHub:
    - https://github.com/DomCim/HA-Schoolday
aux_links_new_tab: true

# Built from the mark's own palette, in _sass/color_schemes/. The dark twin is compiled
# alongside it by assets/css/just-the-docs-schoolday-dark.scss and switched in by the
# button in the header.
color_scheme: schoolday
search_enabled: true

# Callouts, so a warning looks like one instead of a bold paragraph.
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Careful
    color: yellow

# Everything the site needs lives in docs/; nothing else belongs on the site.
exclude:
  - Gemfile
  - Gemfile.lock
