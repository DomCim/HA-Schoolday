name: Release

on:
  # Normal path: push a tag.
  push:
    tags:
      - "v*"
  # Manual path: for environments that cannot push tags. The job creates the tag itself.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (must match manifest.json, package.json and src/lib/const.ts)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Version must match everywhere
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/schoolday/manifest.json'))['version'])")
          PACKAGE=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          TS=$(sed -n "s/.*SCHOOLDAY_VERSION = '\(.*\)'.*/\1/p" src/lib/const.ts)
          echo "want=$VERSION manifest=$MANIFEST package=$PACKAGE ts=$TS"
          fail=0
          for name in MANIFEST PACKAGE TS; do
            value="${!name}"
            if [ "$value" != "$VERSION" ]; then
              echo "::error::$name version '$value' does not match '$VERSION'"
              fail=1
            fi
          done
          exit $fail

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Committed bundle must match the sources
        run: |
          if ! git diff --exit-code -- custom_components/schoolday/frontend/; then
            echo "::error::schoolday-panel.js is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

      - run: npx playwright install --with-deps chromium
      - run: npm test

      # HACS installs integrations straight from the source archive, so no build
      # artifact needs attaching — the bundle is already committed in the tree.
      # `gh release create` creates the tag at --target when it does not exist yet.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, nothing to do"
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
