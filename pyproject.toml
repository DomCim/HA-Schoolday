# Ruff's rule set, written down rather than left to whatever the tool defaults to.
#
# It was left to the default once, and that is exactly how CI went red on a branch
# that was green locally: ruff 0.16 widened its defaults, DTZ came along with them,
# and it was right — every `date.today()` in the storage layer read the container's
# timezone rather than the one Home Assistant is configured for.
#
# So the set is a decision now, and the version is pinned in CI. Widening it is a
# deliberate act with a commit behind it, not something that happens on a Tuesday.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E4", "E7", "E9",  # pycodestyle: the errors, not the whitespace opinions
  "F",               # pyflakes
  "B",               # bugbear
  "DTZ",             # naive datetimes — see above
  "SIM",             # simplifications that genuinely read better
  "UP",              # syntax this Python version makes nicer
]
