# Hearth-Board für den Goldammerweg — Stand Hearth 0.4.0
#
# Einfügen: Einstellungen → Dashboards → Dashboard hinzufügen (leer, Titel "Hearth",
# Symbol mdi:fireplace) → öffnen → Stift → Drei-Punkte → Raw-Konfigurationseditor →
# alles ersetzen durch den Inhalt dieser Datei.
#
# Enthält ausschließlich Hearth-Karten. Damit ist dieses Dashboard nebenbei ein
# sauberer Test für dein Renderproblem: zeigt es hier alles, liegt es nicht an Hearth.
#
# Die Listen-Karten haben explizite entities, weil "Familienlisten" in den
# Hearth-Optionen noch leer ist. Trägst du sie dort nach, kann entities entfallen.

views:
- title: Board
  path: board
  icon: mdi:bulletin-board
  type: sections
  max_columns: 4
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: custom:hearth-header-card
      weather_entity: weather.forecast_goldammerweg
      greeting: Goldammerweg
      grid_options:
        columns: full
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Familie
      icon: mdi:account-group
    - type: custom:hearth-people-card
      show_events: true
      max_events: 2
      grid_options:
        columns: full
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Routine
      icon: mdi:checkbox-marked-circle-outline
    - type: custom:hearth-routines-card
      block: auto
      evening_from: 14
      grid_options:
        columns: full
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Stundenplan
      icon: mdi:school-outline
    # Ohne Optionen: die Karte nimmt das Stundenraster aus den Hearth-Optionen, bietet
    # die Kinder mit Stundenplan zur Auswahl an und hebt die laufende Stunde hervor.
    - type: custom:hearth-timetable-card
      grid_options:
        columns: full
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Kalender
      icon: mdi:calendar-month
    - type: custom:hearth-calendar-card
      view: month
      views:
      - month
      - week
      - day
      show_legend: true
      create: true
      max_events_per_day: 4
      grid_options:
        columns: full
        rows: 14
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Als Nächstes
      icon: mdi:clock-outline
    - type: custom:hearth-agenda-card
      days: 3
      max_events: 6
      grid_options:
        columns: full
- title: Listen
  path: listen
  icon: mdi:format-list-checks
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Einkaufslisten
      icon: mdi:cart
    - type: custom:hearth-lists-card
      entities:
      - todo.kaufland
      - todo.dm
      - todo.obi
      - todo.tedi
      columns: 4
      max_items: 12
      grid_options:
        columns: full
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Familie & Erinnerungen
      icon: mdi:home-heart
    - type: custom:hearth-lists-card
      entities:
      - todo.familie
      - todo.familien_erinnerungen
      - todo.erinnerungen
      - todo.jan_todo
      columns: 4
      max_items: 12
      grid_options:
        columns: full
