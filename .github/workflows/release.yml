name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Version must match the tag everywhere
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/hearth/manifest.json'))['version'])")
          PACKAGE=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          TS=$(sed -n "s/.*HEARTH_VERSION = '\(.*\)'.*/\1/p" src/lib/const.ts)
          echo "tag=$TAG manifest=$MANIFEST package=$PACKAGE ts=$TS"
          fail=0
          for name in MANIFEST PACKAGE TS; do
            value="${!name}"
            if [ "$value" != "$TAG" ]; then
              echo "::error::$name version '$value' does not match tag '$TAG'"
              fail=1
            fi
          done
          exit $fail

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Committed bundle must match the sources
        run: |
          if ! git diff --exit-code -- custom_components/hearth/frontend/; then
            echo "::error::hearth-panel.js is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

      # HACS installs integrations straight from the source archive, so no build
      # artifact needs attaching — the bundle is already committed in the tree.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
