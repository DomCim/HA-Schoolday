set_routine_step:
  fields:
    member:
      required: true
      example: Ben
      selector:
        text:
    block:
      required: true
      default: morning
      selector:
        select:
          options:
            - morning
            - evening
    step:
      required: true
      example: Sportsachen einpacken
      selector:
        text:
    done:
      required: false
      default: true
      selector:
        boolean:

reset_routine:
  fields:
    member:
      required: false
      example: Ben
      selector:
        text:

# --- the configuration itself ----------------------------------------------
# What the options dialog offers, so a card can offer it too. Each of these
# validates exactly what the options flow validates.

set_periods:
  fields:
    periods:
      required: true
      example: ["08:00-08:45", "08:45-09:30"]
      selector:
        object:
    # Omit for the household's usual times. Naming a school writes that school's
    # instead, and an empty list of periods under a name removes it.
    schedule:
      required: false
      example: Gymnasium
      selector:
        text:

set_lesson:
  fields:
    week:
      required: false
      default: 0
      example: 0
      selector:
        number:
          min: 0
          max: 1
          mode: box

    member:
      required: true
      example: Ben
      selector:
        text:
    weekday:
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 6
          mode: box
    period:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box
    subject:
      required: false
      example: Mathe
      selector:
        text:
    room:
      required: false
      example: 1.OG 5
      selector:
        text:

set_day:
  fields:
    week:
      required: false
      default: 0
      example: 0
      selector:
        number:
          min: 0
          max: 1
          mode: box

    member:
      required: true
      example: Ben
      selector:
        text:
    weekday:
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 6
          mode: box
    lessons:
      required: true
      example: [{ period: 1, subject: Mathe, room: 1.OG 5 }]
      selector:
        object:

set_routine:
  fields:
    member:
      required: true
      example: Ben
      selector:
        text:
    block:
      required: true
      default: morning
      selector:
        select:
          options:
            - morning
            - evening
    day:
      required: true
      example: "0"
      selector:
        text:
    steps:
      required: true
      example: ["Zähne putzen", "Ranzen packen"]
      selector:
        object:

set_subject_color:
  fields:
    subject:
      required: true
      example: Mathe
      selector:
        text:
    color:
      required: false
      selector:
        color_rgb:

set_member:
  fields:
    member:
      required: false
      example: Ben
      selector:
        text:
    name:
      required: true
      example: Ben
      selector:
        text:
    color:
      required: false
      selector:
        color_rgb:
    calendar:
      required: false
      selector:
        entity:
          domain: calendar
    # What a school system publishes for this member, e.g. the WebUntis or Schulmanager
    # integration's timetable and exams calendars. Omitted means none, like the fields above.
    lessons_calendar:
      required: false
      selector:
        entity:
          domain: calendar
    exams_calendar:
      required: false
      selector:
        entity:
          domain: calendar
    # A school system's homework, e.g. Schulmanager Online's to-do list for this child.
    homework_list:
      required: false
      selector:
        entity:
          domain: todo
    avatar:
      required: false
      selector:
        text:
    # Minutes from the front door to school, which gives this member a leaving time.
    # Omitted means none, like the fields above; 0 is a leaving time at the bell.
    travel_minutes:
      required: false
      example: 15
      selector:
        number:
          min: 0
          max: 240
          unit_of_measurement: min
          mode: box
    # A leaving time by the clock — the school bus, a lift — which beats the way to
    # school because it does not move with the first lesson. Omitted means none.
    leave_time:
      required: false
      example: "07:05"
      selector:
        time:
    # The same for a day in holiday care.
    care_leave_time:
      required: false
      example: "06:45"
      selector:
        time:
    # Which named set of lesson times this member's school rings to. Omit or leave
    # empty for the household's usual ones.
    schedule:
      required: false
      example: Gymnasium
      selector:
        text:

remove_member:
  fields:
    member:
      required: true
      example: Ben
      selector:
        text:

set_calendars:
  fields:
    school_calendars:
      required: false
      selector:
        entity:
          domain: calendar
          multiple: true
    care_keywords:
      required: false
      example: ["Ferienbetreuung", "Hort"]
      selector:
        object:
    cancel_keywords:
      required: false
      example: ["Cancelled", "Entfall"]
      selector:
        object:
    substitute_keywords:
      required: false
      example: ["Irregular", "Vertretung"]
      selector:
        object:

set_materials:
  fields:
    subject:
      required: true
      example: Sport
      selector:
        text:
    items:
      required: true
      example: ["Sportbeutel", "Turnschuhe"]
      selector:
        object:

set_absent:
  fields:
    member:
      required: true
      example: Ben
      selector:
        text:
    absent:
      required: false
      default: true
      selector:
        boolean:
    until:
      required: false
      selector:
        date:

set_exception:
  fields:
    member:
      required: true
      example: Ben
      selector:
        text:
    date:
      required: true
      example: "2026-09-18"
      selector:
        date:
    period:
      required: false
      example: 3
      selector:
        number:
          min: 1
          max: 20
          mode: box
    subject:
      required: false
      example: Sport
      selector:
        text:
    room:
      required: false
      selector:
        text:
    cancelled:
      required: false
      default: false
      selector:
        boolean:
    label:
      required: false
      example: Wandertag
      selector:
        text:

clear_exception:
  fields:
    member:
      required: true
      example: Ben
      selector:
        text:
    date:
      required: true
      example: "2026-09-18"
      selector:
        date:

set_cycle:
  fields:
    weeks:
      required: true
      example: 2
      selector:
        number:
          min: 1
          max: 2
          mode: box
    iso_week:
      required: false
      example: 37
      selector:
        number:
          min: 1
          max: 53
          mode: box
    iso_year:
      required: false
      example: 2026
      selector:
        number:
          min: 2000
          max: 2100
          mode: box
    anchor:
      required: false
      example: "2026-09-07"
      selector:
        date:
