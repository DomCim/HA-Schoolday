blueprint:
  name: "Schoolday: time-to-leave light"
  description: >-
    A light that turns amber a few minutes before a child has to leave for school and
    red when it is time, then switches off again. For a child who walks, the leaving
    time comes from the way to school and the first lesson, so it moves by itself when
    the first lesson is cancelled; for a child with a bus time it stays at the bus.
    Days in holiday care count when the child has a time for them, and it stays dark
    on days with neither.


    Needs a way to school or a time to leave on the child, which gives them a "time to
    leave" sensor.
  domain: automation
  source_url: https://github.com/DomCim/HA-Schoolday/blob/main/custom_components/schoolday/blueprints/leave_light.yaml
  homeassistant:
    min_version: "2025.1.0"
  input:
    leave_sensor:
      name: Time to leave
      description: The child's "time to leave" sensor from Schoolday.
      selector:
        entity:
          filter:
            - integration: schoolday
              domain: sensor
              device_class: timestamp
    lights:
      name: Light
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
    warn_minutes:
      name: Warning
      description: How many minutes before leaving the light turns amber.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    warn_color:
      name: Warning colour
      default: [255, 160, 0]
      selector:
        color_rgb: {}
    go_color:
      name: Leaving colour
      default: [255, 0, 0]
      selector:
        color_rgb: {}
    brightness:
      name: Brightness
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    off_minutes:
      name: Switch off after
      description: How many minutes after the leaving time the light goes off again.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min

mode: queued
max: 5

trigger_variables:
  leave_sensor: !input leave_sensor
  warn_minutes: !input warn_minutes
  off_minutes: !input off_minutes

# Templates rather than time triggers with an offset: an offset cannot come from a
# number the user picked, and these follow the leaving time when it moves. A template
# that mentions now() is checked at the start of every minute.
triggers:
  - trigger: template
    id: warn
    value_template: >-
      {% set at = states(leave_sensor) | as_datetime(none) %}
      {{ at is not none and at - timedelta(minutes=warn_minutes | int) <= now() < at }}
  - trigger: template
    id: go
    value_template: >-
      {% set at = states(leave_sensor) | as_datetime(none) %}
      {{ at is not none and at <= now() < at + timedelta(minutes=off_minutes | int) }}
  - trigger: template
    id: "off"
    value_template: >-
      {% set at = states(leave_sensor) | as_datetime(none) %}
      {{ at is not none and now() >= at + timedelta(minutes=off_minutes | int) }}
  # The leaving time moves on to the next day once the first lesson has begun, or ten
  # minutes after a bus time, which can be before the light was due off. Only a leaving time that has just passed
  # counts: the evening's calendar read moving tomorrow's must not touch the light.
  - trigger: state
    id: moved
    entity_id: !input leave_sensor

variables:
  lights: !input lights
  warn_color: !input warn_color
  go_color: !input go_color
  brightness: !input brightness

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: warn
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ lights }}"
            data:
              rgb_color: "{{ warn_color }}"
              brightness_pct: "{{ brightness }}"
      - conditions:
          - condition: trigger
            id: go
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ lights }}"
            data:
              rgb_color: "{{ go_color }}"
              brightness_pct: "{{ brightness }}"
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: "off"
              - condition: template
                value_template: >-
                  {% set was = trigger.from_state.state | as_datetime(none)
                     if trigger.id == 'moved' and trigger.from_state else none %}
                  {{ was is not none
                     and was - timedelta(minutes=warn_minutes | int) <= now()
                     <= was + timedelta(hours=2) }}
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ lights }}"
