name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # A publication-readiness check, not a code check. hacs/action reads the repository
  # through the GitHub API against the DEFAULT branch, so on a feature branch it sees
  # none of the files and fails on every push. Restricted to the default branch, where
  # its verdict is actually meaningful.
  hacs:
    name: HACS
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # topics: the last thing standing between this repository and a submission to
          #         the HACS default store, and the only one that cannot be fixed from
          #         inside the repository — it is a setting on GitHub. Drop this from the
          #         ignore list the day the topics are set, and the job becomes the real
          #         gate rather than a rehearsal of it.
          #
          # brands and description were here too, and are not any more: the four images
          # now ship in custom_components/schoolday/brand/, which is where HACS looks,
          # and the repository has a description.
          ignore: topics

  # Ruff and the configuration tests. They existed before this job did and were only
  # ever run by hand, which meant nothing stopped a broken config_writes from being
  # merged. A required status check can only require what actually runs.
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned. An unpinned linter is a check whose meaning changes without a commit:
      # ruff 0.16 widened its default rules and turned a green branch red overnight.
      # The rules themselves live in pyproject.toml.
      - run: pip install "ruff==0.16.1"
      - run: ruff check custom_components/
      - name: Configuration writes, models and the static service checks
        run: python3 test/config_writes_test.py

  # The site is built here as well as in pages.yml, and on purpose. pages.yml only runs
  # on the default branch, so until this job existed a page that Jekyll cannot render
  # was discovered after it had been merged and there was nothing left to stop.
  #
  # This one builds and throws the result away: no configure-pages, no artifact, no
  # deployment. That keeps it independent of the repository's Pages setting, so a pull
  # request is judged on whether the documentation builds and on nothing else.
  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
      - name: Build
        working-directory: docs
        run: bundle exec jekyll build --baseurl "/HA-Schoolday"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Committed bundle must match the sources
        run: |
          if ! git diff --exit-code -- custom_components/schoolday/frontend/; then
            echo "::error::schoolday-panel.js is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-screenshots
          path: test/smoke/screenshots/
          if-no-files-found: ignore
