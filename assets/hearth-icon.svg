<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Hearth">
  <title>Hearth</title>
  <defs>
    <linearGradient id="flame" x1="32" y1="16" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7c948"/>
      <stop offset=".5" stop-color="#e0603a"/>
      <stop offset="1" stop-color="#c2412c"/>
    </linearGradient>
  </defs>

  <!-- Warm dark ground, the same tone as the console banner. -->
  <rect width="64" height="64" rx="14" fill="#2b2118"/>

  <!-- The hearth opening: an arch standing on the mantel. -->
  <g fill="none" stroke="#f0e2d2" stroke-width="3.4" stroke-linecap="round" stroke-opacity=".92">
    <path d="M13 52V29a19 19 0 0 1 38 0v23"/>
    <path d="M8.5 52h47"/>
  </g>

  <!-- The fire itself. Asymmetric on purpose: a symmetric teardrop reads as water. -->
  <path
    d="M33.6 16c.6 5.4 4.2 7.8 7 11.2 2.5 3 3.4 5.4 3.4 8.3a12 12 0 0 1-24 0c0-3.7 1.5-6.7 4.6-10 .3 1.7 1.1 2.9 2.2 3.5C25.6 23.4 28.9 18.8 33.6 16Z"
    fill="url(#flame)"
  />
  <path
    d="M32.4 29.6c.4 2.6 2 3.7 3.2 5.3 1 1.3 1.4 2.3 1.4 3.5a5 5 0 0 1-10 0c0-1.7.8-3 2.4-4.6.3.8.6 1.2 1.1 1.5-.4-2 .5-4 1.9-5.7Z"
    fill="#fdf0c8"
    fill-opacity=".9"
  />
</svg>
